version: 2

models:
  - name: stg_meteo_hourly
    description: "Pivoted hourly weather data — one row per (timestamp, location) with metric columns"
    columns:
      - name: meteo_hourly_key
        description: "Surrogate key from timestamp + lat + lon"
        tests:
          - unique
          - not_null
      - name: timestamp_utc
        tests:
          - not_null
      - name: latitude
        tests:
          - not_null
      - name: longitude
        tests:
          - not_null

  - name: stg_vrm_log_hourly
    description: >
      Silver — VRM /download log export aggregated to hourly granularity.
      One row per (site_id, UTC hour).

      The /download endpoint returns raw device log data at sub-hourly intervals
      (typically 15 minutes). This model aggregates to one row per hour:
        Instantaneous measurements (W, %, V, A, °C, Hz) → AVG over samples in the hour.
        Energy columns (kWh) → MAX - MIN (cumulative counter delta confirmed by API inspection).
        greatest(0, ...) guards against counter resets on device restart.
        Text columns → MAX as proxy for most recent value.

      Inkrementaalne mudel (delete+insert).
      Incremental filter: fetched_at > max(fetched_at) - 1 hour.
      Source: docs/vrm-log-pipeline.md
    columns:
      - name: vrm_log_key
        description: "Surrogate key (site_id + recorded_at)"
        tests:
          - unique
          - not_null
      - name: site_id
        tests:
          - not_null
      - name: recorded_at
        description: "Hour timestamp in UTC"
        tests:
          - not_null
      - name: fetched_at
        tests:
          - not_null
      - name: battery_soc_pct
        description: "Battery state of charge, % — Battery Monitor [512] State of charge"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
      - name: ac_consumption_l1_w
        description: "AC load power phase 1, W — System overview [0] AC Consumption L1"
      - name: ac_consumption_l2_w
        description: "AC load power phase 2, W — System overview [0] AC Consumption L2"
      - name: ac_consumption_l3_w
        description: "AC load power phase 3, W — System overview [0] AC Consumption L3"
      - name: pv_energy_l1_kwh
        description: "PV energy produced phase 1 this hour, kWh — PV Inverter [20] L1 Energy"
      - name: pv_energy_l2_kwh
        description: "PV energy produced phase 2 this hour, kWh — PV Inverter [20] L2 Energy"
      - name: pv_energy_l3_kwh
        description: "PV energy produced phase 3 this hour, kWh — PV Inverter [20] L3 Energy"
      - name: pv_energy_total_kwh
        description: "Total PV energy produced this hour (L1+L2+L3), kWh"
